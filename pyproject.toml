[project]
name = "qozon-langchain"
version = "0.1.0"
description = "Qozon LangChain Phase 1 project foundation"
readme = "README.md"
requires-python = ">=3.12.14,<3.13"
dependencies = [
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "langchain==1.4.4",
    "langchain-openai==1.7.0",
    "langchain-text-splitters==1.1.3",
    "langsmith==0.14.7",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.4",
    "uvicorn==0.54.0",
]

[project.scripts]
qozon-langchain = "qozon_langchain.__main__:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
prerelease = "explicit"
default-groups = ["dev", "ingestion"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
markers = ["live_model: opt-in tests that contact OpenAI and may incur API charges"]

[dependency-groups]
ingestion = [
    "chromadb==1.5.9",
    "langchain-chroma==1.1.0",
    "langchain-community==0.4.2",
    "langchain-docling[local]==3.0.0",
    "opencv-python-headless==4.13.0.92",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-semantic-conventions==0.65b0",
    "rank-bm25==0.2.2",
]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]
